<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI自律文明発展ゲーム - PoC</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <!-- 上部バー: ステータス・操作ボタン -->
  <div id="room-bar">
    <span class="brand">🌱 AI自律文明 PoC</span>
    <button id="btn-open-creator">住民を作成</button>
    <button id="btn-open-roster">キャラ一覧</button>
    <span class="speed-group">
      <button id="btn-speed-0" class="speed-btn">x0</button>
      <button id="btn-speed-1" class="speed-btn active">x1</button>
      <button id="btn-speed-2" class="speed-btn">x2</button>
      <button id="btn-speed-5" class="speed-btn">x5</button>
    </span>
    <span id="world-clock">☀ 昼 / 1日目</span>
    <span id="room-status">ローカルで動作中</span>
  </div>

  <!-- 起動時: ワールド選択/作成画面 -->
  <div id="world-select-screen">
    <div class="ws-container">
      <h1>🌱 AI自律文明 PoC</h1>
      <div class="ws-tabs">
        <button class="ws-tab active" data-tab="singleplayer">シングルプレイ</button>
        <button class="ws-tab" data-tab="multiplayer">マルチプレイ</button>
      </div>

      <div id="ws-tab-singleplayer" class="ws-tab-content active">
        <div id="ws-world-list" class="ws-list"></div>
        <div class="ws-create-row">
          <input id="ws-new-world-name" type="text" placeholder="新しいワールド名" maxlength="20" />
          <button id="ws-btn-create-world">ワールドを作成</button>
        </div>
      </div>

      <div id="ws-tab-multiplayer" class="ws-tab-content">
        <div id="ws-room-list" class="ws-list"></div>
        <div class="ws-create-row">
          <button id="ws-btn-create-room">新規ルーム作成</button>
          <span class="sep">|</span>
          <input id="ws-input-room-key" type="text" placeholder="ルームキー(6桁)" maxlength="6" />
          <button id="ws-btn-join-room">参加</button>
        </div>
        <p id="ws-room-status" class="ws-status"></p>
      </div>
    </div>
  </div>

  <!-- ファミコン風 住民作成モーダル -->
  <div id="creator-modal" class="famicom-modal">
    <div class="famicom-modal-box creator-box">
      <button id="creator-modal-close" class="famicom-close">×</button>
      <h2 class="famicom-title">住民を作成</h2>

      <div class="creator-columns">
        <div class="creator-left">
          <canvas id="preview-canvas" width="112" height="112"></canvas>
          <button id="btn-randomize" class="randomize-btn" type="button">🎲 ダイスで再生成</button>

          <div class="stat-bars">
            <div class="stat-bar-row">STR <div class="stat-bar"><div id="bar-str" class="stat-bar-fill"></div></div><span id="val-str">-</span></div>
            <div class="stat-bar-row">AGI <div class="stat-bar"><div id="bar-agi" class="stat-bar-fill"></div></div><span id="val-agi">-</span></div>
            <div class="stat-bar-row">INT <div class="stat-bar"><div id="bar-int" class="stat-bar-fill"></div></div><span id="val-int">-</span></div>
            <div class="stat-bar-row">CHA <div class="stat-bar"><div id="bar-cha" class="stat-bar-fill"></div></div><span id="val-cha">-</span></div>
          </div>
        </div>

        <div class="creator-right">
          <label>名前</label>
          <input id="input-char-name" type="text" placeholder="例: ゲンジ" />

          <label>性格・職業プロンプト</label>
          <textarea id="input-char-prompt" rows="2" placeholder="例: 頑固な木こり"></textarea>

          <label class="small-label">肌の色</label>
          <div id="skin-swatches" class="swatch-row"></div>

          <label class="small-label">髪の色</label>
          <div id="hair-swatches" class="swatch-row"></div>

          <div class="override-controls">
            <label class="small">服の色 <input id="override-clothes-color" type="color" /></label>
            <label class="small checkbox"><input id="override-hat" type="checkbox" /> 帽子をかぶる</label>
            <label class="small">帽子の色 <input id="override-hat-color" type="color" /></label>
          </div>

          <p class="hint">
            職業キーワード: 木こり/魔法使い/商人/農民/鉱夫/兵士/漁師<br />
            性格キーワード: 頑固/元気/のんびり/ドジ/真面目/怠け/優しい/慎重
          </p>

          <button id="btn-spawn" class="spawn-btn">この住民をマップに配置</button>
          <button id="btn-save-library" class="library-save-btn">ライブラリに保存</button>
        </div>
      </div>

      <hr />
      <h3>キャラライブラリ(保存済みテンプレート)</h3>
      <div id="library-list" class="ws-list library-list"></div>
    </div>
  </div>

  <!-- 作ったキャラクター一覧(現在のワールドに存在する住民) -->
  <div id="roster-modal" class="famicom-modal">
    <div class="famicom-modal-box">
      <button id="roster-modal-close" class="famicom-close">×</button>
      <h2 class="famicom-title">住民一覧</h2>
      <div id="roster-list" class="ws-list roster-list"></div>
    </div>
  </div>

  <!-- ファミコン風キャラ詳細モーダル -->
  <div id="char-modal" class="famicom-modal">
    <div class="famicom-modal-box">
      <button id="char-modal-close" class="famicom-close">×</button>
      <div class="famicom-modal-body">
        <div class="famicom-sprite-wrap">
          <div id="char-modal-mood-bubble" class="mood-bubble"></div>
          <canvas id="char-modal-sprite" width="96" height="96" class="famicom-sprite"></canvas>
        </div>
        <div class="famicom-info">
          <div class="famicom-name" id="char-modal-name">-</div>
          <div class="famicom-row">所属: <span id="char-modal-affiliation">-</span></div>
          <div class="famicom-row">職業: <span id="char-modal-job">-</span></div>
          <div class="famicom-row">STR/AGI/INT/CHA: <span id="char-modal-basestats">-</span></div>
          <div class="famicom-row">HP/空腹/疲労: <span id="char-modal-vitals">-</span></div>
          <div class="famicom-row">年齢/言語Lv: <span id="char-modal-age">-</span></div>
        </div>
      </div>
      <div class="famicom-tags">
        <div class="tag-group"><span class="tag-group-label">先天性性格</span><div id="char-modal-innate-tags" class="tag-row"></div></div>
        <div class="tag-group"><span class="tag-group-label">後天性性格</span><div id="char-modal-acquired-tags" class="tag-row"></div></div>
        <div class="tag-group"><span class="tag-group-label">能力</span><div id="char-modal-ability-tags" class="tag-row"></div></div>
        <div class="tag-group"><span class="tag-group-label">肩書き</span><div id="char-modal-title-tags" class="tag-row"></div></div>
        <div class="tag-group"><span class="tag-group-label">好きなこと</span><div id="char-modal-likes" class="tag-row"></div></div>
        <div class="tag-group"><span class="tag-group-label">苦手なこと</span><div id="char-modal-dislikes" class="tag-row"></div></div>
        <div class="tag-group"><span class="tag-group-label">持ち物</span><div id="char-modal-inventory" class="tag-row"></div></div>
      </div>
    </div>
  </div>

  <!-- 動物詳細モーダル -->
  <div id="animal-modal" class="famicom-modal">
    <div class="famicom-modal-box">
      <button id="animal-modal-close" class="famicom-close">×</button>
      <div class="famicom-modal-body">
        <div class="famicom-sprite-wrap">
          <div id="animal-modal-mood-bubble" class="mood-bubble"></div>
          <canvas id="animal-modal-sprite" width="96" height="96" class="famicom-sprite"></canvas>
        </div>
        <div class="famicom-info">
          <div class="famicom-name" id="animal-modal-name">-</div>
          <div class="famicom-row">状態: <span id="animal-modal-status">-</span></div>
        </div>
      </div>
      <div class="famicom-tags">
        <div id="animal-modal-traits" class="tag-row"></div>
      </div>
    </div>
  </div>

  <!-- PeerJS (P2Pマルチプレイ用) -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <script src="./noise.js"></script>
  <script src="./mapGen.js"></script>
  <script src="./camera.js"></script>
  <script src="./spriteGen.js"></script>
  <script src="./animals.js"></script>
  <script src="./worldRules.js"></script>
  <script src="./personalityData.js"></script>
  <script src="./aiEngine.js"></script>
  <script src="./character.js"></script>
  <script src="./storage.js"></script>
  <script src="./room.js"></script>
  <script src="./main.js"></script>
  <script src="./worldSelect.js"></script>
</body>
</html>
